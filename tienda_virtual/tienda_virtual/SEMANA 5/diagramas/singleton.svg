<svg viewBox="0 0 727 491" width="727" height="491" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama UML del patrón Singleton: las clases Database y Logger devuelven siempre la misma instancia">
<rect x="0" y="0" width="727" height="491" fill="#f5f7fa"/>

<defs>
  <marker id="gen" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto">
    <polygon points="0,0 16,7 0,14" fill="#ffffff" stroke="#1a2233" stroke-width="1.2"/>
  </marker>
  <marker id="dep" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
    <polyline points="0,0 10,5 0,10" fill="none" stroke="#1a2233" stroke-width="1.3"/>
  </marker>
</defs>

<path d="M164.88,108 C 158.88,74 300.12,74 294.12,108" fill="none" stroke="#1a2233" stroke-width="1.3" marker-end="url(#dep)"/>
<text x="229.5" y="68" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11.5" fill="#1a2233" opacity="0.75">siempre la misma instancia</text>
<path d="M547.8,108 C 541.8,74 622.2,74 616.2,108" fill="none" stroke="#1a2233" stroke-width="1.3" marker-end="url(#dep)"/>
<text x="582.0" y="68" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11.5" fill="#1a2233" opacity="0.75">siempre la misma instancia</text>
<g transform="translate(50,108)">
<rect x="0" y="0" width="359" height="189" rx="6" fill="#ffffff" stroke="#1a2233" stroke-width="1.3"/>
<text x="179.5" y="21" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-style="italic" font-size="11.5" fill="#1a2233" opacity="0.72">«Singleton»</text>
<text x="179.5" y="40" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700"  font-size="15" fill="#1a2233">Database</text>
<line x1="0" y1="56" x2="359" y2="56" stroke="#1a2233" stroke-width="1"/>
<text x="14" y="70" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#1a2233" text-decoration="underline"><tspan fill="#1a2233" opacity="0.6">-</tspan> _instancia: Database</text>
<text x="14" y="89" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#1a2233"><tspan fill="#1a2233" opacity="0.6">-</tspan> _conexion: Connection</text>
<line x1="0" y1="104" x2="359" y2="104" stroke="#1a2233" stroke-width="1"/>
<text x="14" y="118" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#1a2233" text-decoration="underline"><tspan fill="#1a2233" opacity="0.6">+</tspan> __new__(cls): Database</text>
<text x="14" y="137" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#1a2233"><tspan fill="#1a2233" opacity="0.6">+</tspan> obtener_conexion(): Connection</text>
<text x="14" y="156" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#1a2233"><tspan fill="#1a2233" opacity="0.6">+</tspan> ejecutar_consulta(query, parametros, fetch)</text>
<text x="14" y="175" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#1a2233"><tspan fill="#1a2233" opacity="0.6">-</tspan> _conectar()</text>
</g>
<g transform="translate(487,108)">
<rect x="0" y="0" width="190" height="227" rx="6" fill="#ffffff" stroke="#1a2233" stroke-width="1.3"/>
<text x="95.0" y="21" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-style="italic" font-size="11.5" fill="#1a2233" opacity="0.72">«Singleton»</text>
<text x="95.0" y="40" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700"  font-size="15" fill="#1a2233">Logger</text>
<line x1="0" y1="56" x2="190" y2="56" stroke="#1a2233" stroke-width="1"/>
<text x="14" y="70" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#1a2233" text-decoration="underline"><tspan fill="#1a2233" opacity="0.6">-</tspan> _instancia: Logger</text>
<text x="14" y="89" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#1a2233"><tspan fill="#1a2233" opacity="0.6">-</tspan> _logger: Logger</text>
<line x1="0" y1="104" x2="190" y2="104" stroke="#1a2233" stroke-width="1"/>
<text x="14" y="118" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#1a2233" text-decoration="underline"><tspan fill="#1a2233" opacity="0.6">+</tspan> __new__(cls): Logger</text>
<text x="14" y="137" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#1a2233"><tspan fill="#1a2233" opacity="0.6">+</tspan> info(mensaje)</text>
<text x="14" y="156" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#1a2233"><tspan fill="#1a2233" opacity="0.6">+</tspan> warning(mensaje)</text>
<text x="14" y="175" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#1a2233"><tspan fill="#1a2233" opacity="0.6">+</tspan> error(mensaje)</text>
<text x="14" y="194" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#1a2233"><tspan fill="#1a2233" opacity="0.6">+</tspan> debug(mensaje)</text>
<text x="14" y="213" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#1a2233"><tspan fill="#1a2233" opacity="0.6">-</tspan> _configurar()</text>
</g>
<g transform="translate(111.5,369)">
<path d="M0,0 H224 L236,12 V92 H0 Z" fill="#eef1f6" stroke="#1a2233" stroke-width="1" opacity="0.97"/>
<path d="M224,0 V12 H236" fill="none" stroke="#1a2233" stroke-width="1"/>
<text x="12" y="20" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#1a2233" opacity="0.85">Sin importar cuántas veces se</text>
<text x="12" y="36" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#1a2233" opacity="0.85">llame Database(), __new__ frena</text>
<text x="12" y="52" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#1a2233" opacity="0.85">la creación y reutiliza la</text>
<text x="12" y="68" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#1a2233" opacity="0.85">conexión ya abierta a bdaverd.</text>
</g>
<line x1="229.5" y1="369" x2="229.5" y2="297" stroke="#1a2233" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
<g transform="translate(464.0,369)">
<path d="M0,0 H224 L236,12 V92 H0 Z" fill="#eef1f6" stroke="#1a2233" stroke-width="1" opacity="0.97"/>
<path d="M224,0 V12 H236" fill="none" stroke="#1a2233" stroke-width="1"/>
<text x="12" y="20" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#1a2233" opacity="0.85">Cada módulo hace Logger(), pero</text>
<text x="12" y="36" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#1a2233" opacity="0.85">todos escriben en el mismo</text>
<text x="12" y="52" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#1a2233" opacity="0.85">logger: un solo app.log y una</text>
<text x="12" y="68" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#1a2233" opacity="0.85">sola salida de consola.</text>
</g>
<line x1="582.0" y1="369" x2="582.0" y2="335" stroke="#1a2233" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
</svg>